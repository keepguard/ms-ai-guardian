server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
  rabbitmq:
    host: rabbitmq-service
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://ollama:11434}
      init:
        pull-model-strategy: never

keepguard:
  audit:
    exchange: srv-audit-exchange-local
