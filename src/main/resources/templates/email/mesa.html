<!DOCTYPE html>
<html lang="pt-BR">
<body style="font-family:Segoe UI,sans-serif;background:#f8fafc;padding:20px;">
<div style="max-width:640px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;border:1px solid #e2e8f0;">
  <h1 style="font-size:18px;">{{title}}</h1>
  <p><strong>Serviço:</strong> {{serviceName}} &nbsp; <strong>Pod:</strong> {{podName}}</p>
  <p><strong>Conclusão K8s:</strong> {{k8sConclusion}}</p>
  <p>{{body}}</p>
  <p>{{extra}}</p>
  <p><a href="{{ctaUrl}}" style="display:inline-block;padding:10px 18px;background:#0f766e;color:#fff;text-decoration:none;border-radius:8px;">{{ctaLabel}}</a></p>
</div>
</body>
</html>
