server:
  port: 8088

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ms-ai-guardian
  datasource:
    url: jdbc:postgresql://localhost:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_ai_guardian
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://ollama:11434}
      chat:
        options:
          model: deepseek-r1:latest
          temperature: 0.2
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  kubernetes:
    kubeconfig-path: ""
  github:
    token: ${GITHUB_TOKEN:}
    owner: keepguard
  guardian:
    namespace: keepguard
    watcher-enabled: true
    scan-interval-ms: 60000
    anti-flapping-cooldown-minutes: 15
    default-recipient: rafael.nogueira2009@gmail.com
    tenant-id: f7fc7350-b9fc-4e54-9c58-ac9385b23ae3
  rabbitmq:
    exchange: ms-communication-exchange-dev
    routing-key: communication.message.send
    email-exchange: srv-email-google-sender-exchange-dev
    email-routing-key: email.google.send

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

// [KeepGuard AI Guardian]: Patch de resiliência preventiva.
