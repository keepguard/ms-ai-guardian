server:
  port: 8088

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ms-ai-guardian
  datasource:
    url: jdbc:postgresql://localhost:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_ai_guardian
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 8000
  ai:
    # Provedor ativo: app.guardian.llm.provider (gateway | ollama | openai | anthropic | none).
    # Gateway: egress via srv-llm-gateway. Ollama/OpenAI diretos ficam como legado.
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://ollama:11434}
      init:
        # Nunca puxar modelo no boot — isso travava o Spring por minutos.
        pull-model-strategy: never
        timeout: 5s
        max-retries: 0
      chat:
        enabled: ${APP_GUARDIAN_OLLAMA_ENABLED:false}
        options:
          model: ${SPRING_AI_OLLAMA_MODEL:qwen2.5-coder:1.5b}
          temperature: ${APP_GUARDIAN_LLM_TEMPERATURE:0.2}
          num-predict: ${APP_GUARDIAN_LLM_MAX_TOKENS:256}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: ${APP_GUARDIAN_OPENAI_ENABLED:false}
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4.1-mini}
          temperature: ${APP_GUARDIAN_LLM_TEMPERATURE:0.2}
          max-tokens: ${APP_GUARDIAN_LLM_MAX_TOKENS:256}
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:}
      chat:
        enabled: ${APP_GUARDIAN_ANTHROPIC_ENABLED:false}
        options:
          model: ${SPRING_AI_ANTHROPIC_MODEL:claude-3-5-haiku-latest}
          temperature: ${APP_GUARDIAN_LLM_TEMPERATURE:0.2}
          max-tokens: ${APP_GUARDIAN_LLM_MAX_TOKENS:256}

app:
  kubernetes:
    kubeconfig-path: ""
  github:
    token: ${GITHUB_TOKEN:}
    owner: keepguard
  guardian:
    namespace: keepguard
    watcher-enabled: true
    scan-interval-ms: 60000
    anti-flapping-cooldown-minutes: 15
    healthy-streak-required: 3
    max-alert-recipients: 20
    storm:
      deployment-threshold-percent: 40
      min-affected-deployments: 5
      infra-alert-confirm-scans: 2
      state-ttl-seconds: 7200
    console-url: ${APP_GUARDIAN_CONSOLE_URL:https://app-core.keepguard.com.br}
    default-recipient: ${APP_GUARDIAN_DEFAULT_RECIPIENT:}
    tenant-id: ${APP_GUARDIAN_TENANT_ID:}
    approver-github: ${APP_GUARDIAN_APPROVER_GITHUB:human}
    approver-display-name: ${APP_GUARDIAN_APPROVER_DISPLAY_NAME:time}
    redis:
      key-prefix: guardian
      lock-ttl-seconds: 600
      idempotency-ttl-seconds: 86400
      prompt-cache-ttl-seconds: 300
      llm-cache-ttl-seconds: 3600
    rate-limit:
      github-per-second: 10
      llm-per-second: 5
      email-per-second: 20
    llm:
      # none = só heurística. Para ligar o gateway:
      #   APP_GUARDIAN_LLM_PROVIDER=gateway
      #   LLM_GATEWAY_URL=http://srv-llm-gateway:8650
      provider: ${APP_GUARDIAN_LLM_PROVIDER:none}
      gateway-url: ${LLM_GATEWAY_URL:http://srv-llm-gateway:8650}
      gateway-bearer-token: ${LLM_GATEWAY_BEARER_TOKEN:}
      provider-id: ${APP_GUARDIAN_LLM_PROVIDER_ID:}
      model: ${APP_GUARDIAN_LLM_MODEL:}
      timeout-seconds: ${APP_GUARDIAN_LLM_TIMEOUT_SECONDS:45}
      codegen-timeout-seconds: ${APP_GUARDIAN_LLM_CODEGEN_TIMEOUT_SECONDS:90}
      max-tokens: ${APP_GUARDIAN_LLM_MAX_TOKENS:256}
      temperature: ${APP_GUARDIAN_LLM_TEMPERATURE:0.2}
  rabbitmq:
    exchange: ms-communication-exchange-dev
    routing-key: communication.message.send
    email-exchange: srv-email-google-sender-exchange-dev
    email-routing-key: email.google.send

keepguard:
  audit:
    enabled: true
    exchange: ${KEEPGUARD_AUDIT_EXCHANGE:srv-audit-exchange-dev}
    routing-key: audit.event
    source-service: ms-ai-guardian

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
