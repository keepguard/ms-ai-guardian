image:
  repository: ghcr.io/keepguard/ms-ai-guardian
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8088

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

env:
  springProfilesActive: local
  serverPort: 8088
  postgresDb: "keepguard_api_db"
  postgresUser: "keepguard_api_user"
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: 5672
  defaultRecipient: "rafael.nogueira2009@gmail.com"
  namespace: "keepguard"
  watcherEnabled: true

imagePullSecrets:
  - name: ghcr-secret
