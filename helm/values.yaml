image:
  repository: ghcr.io/keepguard/ms-ai-guardian
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8088

# 512Mi de limite + Xmx512m fazia GC eterno no boot. Irmãos Spring usam ~650Mi RSS / 1Gi.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

env:
  springProfilesActive: prod
  serverPort: 8088
  postgresDb: "keepguard_api_db"
  postgresUser: "keepguard_api_user"
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: "5672"
  redisHost: "redis"
  redisPort: "6379"
  defaultRecipient: ""
  consoleUrl: "https://app-core.keepguard.com.br"
  tenantId: ""
  approverGithub: "human"
  approverDisplayName: "time"
  namespace: "keepguard"
  watcherEnabled: true
  # Heap relativo ao cgroup (70% de 1Gi ≈ 700Mi). Nunca use -Xmx igual ao limit do pod.
  javaOpts: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
  llmProvider: "none"
  llmGatewayUrl: "http://srv-llm-gateway:8650"
  ollamaEnabled: "false"
  openaiEnabled: "false"
  anthropicEnabled: "false"

probes:
  startup:
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 36
    timeoutSeconds: 3
  liveness:
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

imagePullSecrets:
  - name: ghcr-secret
