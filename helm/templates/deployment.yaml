apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ai-guardian
  namespace: {{ .Release.Namespace }}
  labels:
    app: ms-ai-guardian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-ai-guardian
  template:
    metadata:
      labels:
        app: ms-ai-guardian
    spec:
      serviceAccountName: ms-ai-guardian-sa
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: ms-ai-guardian
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.env.springProfilesActive | quote }}
        - name: SERVER_PORT
          value: {{ .Values.env.serverPort | quote }}
        - name: JAVA_OPTS
          value: {{ .Values.env.javaOpts | quote }}
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/{{ .Values.env.postgresDb }}"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: keepguard-config
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keepguard-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_RABBITMQ_HOST
          value: {{ .Values.env.rabbitmqHost | quote }}
        - name: SPRING_RABBITMQ_PORT
          value: {{ .Values.env.rabbitmqPort | quote }}
        - name: SPRING_DATA_REDIS_HOST
          value: {{ .Values.env.redisHost | quote }}
        - name: SPRING_DATA_REDIS_PORT
          value: {{ .Values.env.redisPort | quote }}
        - name: RABBITMQ_HOST
          value: {{ .Values.env.rabbitmqHost | quote }}
        - name: RABBITMQ_PORT
          value: {{ .Values.env.rabbitmqPort | quote }}
        - name: KEEPGUARD_AUDIT_EXCHANGE
          value: "srv-audit-exchange-prod"
        - name: APP_GUARDIAN_DEFAULT_RECIPIENT
          value: {{ .Values.env.defaultRecipient | quote }}
        - name: APP_GUARDIAN_CONSOLE_URL
          value: {{ .Values.env.consoleUrl | default "https://app-core.keepguard.com.br" | quote }}
        - name: APP_GUARDIAN_TENANT_ID
          value: {{ .Values.env.tenantId | quote }}
        - name: APP_GUARDIAN_APPROVER_GITHUB
          value: {{ .Values.env.approverGithub | quote }}
        - name: APP_GUARDIAN_APPROVER_DISPLAY_NAME
          value: {{ .Values.env.approverDisplayName | quote }}
        - name: APP_GUARDIAN_NAMESPACE
          value: {{ .Values.env.namespace | quote }}
        - name: APP_GUARDIAN_WATCHER_ENABLED
          value: {{ .Values.env.watcherEnabled | quote }}
        - name: APP_GUARDIAN_LLM_PROVIDER
          value: {{ .Values.env.llmProvider | quote }}
        - name: APP_GUARDIAN_OLLAMA_ENABLED
          value: {{ .Values.env.ollamaEnabled | quote }}
        - name: APP_GUARDIAN_OPENAI_ENABLED
          value: {{ .Values.env.openaiEnabled | quote }}
        - name: APP_GUARDIAN_ANTHROPIC_ENABLED
          value: {{ .Values.env.anthropicEnabled | quote }}
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: ms-ai-guardian-secret
              key: GITHUB_TOKEN
        ports:
        - containerPort: {{ .Values.service.port }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.service.port }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.service.port }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
