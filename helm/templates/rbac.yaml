apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms-ai-guardian-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ms-ai-guardian-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services", "configmaps"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ms-ai-guardian-rb
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: ms-ai-guardian-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: ms-ai-guardian-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ms-ai-guardian-nodes-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ms-ai-guardian-nodes-reader-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ms-ai-guardian-nodes-reader
subjects:
- kind: ServiceAccount
  name: ms-ai-guardian-sa
  namespace: {{ .Release.Namespace }}
